 for(const gid of Object.keys(S.sh)){const d=snapKey(gid);if(!d)continue;const str=JSON.stringify(d);if(str===CL.sh[gid]){if(on2()&&AU2&&MIR.sh[gid]!==str&&S.sh[gid])await mirrorShare(gid,S.sh[gid],d,str);continue}try{await sharePush(gid)}catch(e){CL.msg='分享更新失敗：'+cloudErr(e.message)}}}
async function shareCreate(gid){
 try{const id=await sharePush(gid);S.sh=S.sh||{};S.sh[gid]=id;V.smm=null;save()}catch(e){V.smm='建立失敗：'+cloudErr(e.message)}R()}
async function shareStop(gid){
 try{await sbFetch('/rest/v1/shares?owner=eq.'+uidOf()+'&game_id=eq.'+encodeURIComponent(gid),{method:'DELETE'});if(on2()&&AU2)try{await sb2Fetch('/rest/v1/shares?owner=eq.'+uidOf2()+'&game_id=eq.'+encodeURIComponent(gid),{method:'DELETE'})}catch(e){}delete S.sh[gid];delete CL.sh[gid];V.smm=null;save()}catch(e){V.smm='停止失敗：'+cloudErr(e.message)}R()}
function copyShare(){
 const el=$('shl'),v=el&&el.value;const done=()=>{V.toast='已複製連結';R();setTimeout(()=>{V.toast=null;R()},1500)};
 try{navigator.clipboard.writeText(v).then(done,()=>{el.select()})}catch(e){el&&el.select()}}
function shareModal(){
 const gid=V.sm,TMN='知道連結的人可以查看這支球隊的打擊、投球、守備數據，並隨你的紀錄自動更新。',tm=gid.startsWith('team:'),noun=tm?'這支球隊的打擊、投球、守備數據':'這場比賽',id=(S.sh||{})[gid],link=id?location.origin+location.pathname+'?w='+id:'';
 return `<div class=mo onclick="V.sm=null;R()"><div class=md onclick="event.stopPropagation()"><b>🔗 分享${tm?'球隊數據':'比賽'}</b>`+(!AU?`<div class=row>請先點上方 ☁️ 登入，才能建立分享連結。</div>`:id?`<div class=row style="font-size:12px;opacity:.8">${tm?TMN:`知道這個連結的人都能即時查看${noun}（唯讀），內容會隨你的紀錄自動更新：`}</div><div class=row><input id=shl value="${link}" readonly style="flex:1" onclick="this.select()"></div><div class=row>${btn('複製連結','copyShare()','pri')}${btn('停止分享',`shareStop('${gid}')`)}</div>`:`<div class=row style="font-size:12px;opacity:.8">${tm?TMN:`建立連結後，知道連結的人可以唯讀查看${noun}，並隨你的紀錄自動更新。`}</div><div class=row>${btn('建立分享連結',`shareCreate('${gid}')`,'pri')}</div>`)+(V.smm?`<div class=row style="color:#d00;font-size:12px">${V.smm}</div>`:'')+`<div class=row style="justify-content:flex-end">${btn('關閉','V.sm=null;R()')}</div></div></div>`}

  let body=V.sub=='bx'?boxTable(g,o):V.sub=='rec'?vBoard(g,o):V.sub=='log'?recLog(g,o):stats(g,o).replace(/<span style="margin-left:auto"><button[^>]*>🔧<\/button><\/span>/,'');

function vBoard(g,o){
 if(g.lu.a.some(x=>!x.p)||g.lu.h.some(x=>!x.p))return board(g,o)+'<p>先發名單尚未設定完成。</p>';
 const bt=o.top?'a':'h',df=o.top?'h':'a',bi=o.bi[bt]%9;
 return board(g,o)+(o.over?`<div class=c><b>比賽結束</b>　${tot(o,'a')} : ${tot(o,'h')}</div>`:'')+`<div style="${o.over?'pointer-events:none;opacity:.35':''}"><div class="c live"><div>${bases(o,false)}</div><div>${lamp('B',o.b,3,'#22c55e')}${lamp('S',o.s,2,'#facc15')}${lamp('O',o.outs,2,'#ef4444')}</div><div class=lv><b>${o.in}局${o.top?'上':'下'}</b><span><b>P</b> ${o.pt[o.pit[df]]?o.pt[o.pit[df]].P:0}</span>${lrow('投手',o.pit[df])}${lrow(bi+1+'棒',o.lu[bt][bi])}</div></div>
 <div class=c><div style="text-align:center"><b>本打席逐球</b></div><div class=sy>${o.cur.filter(x=>x.p).map(x=>PIC(x.k)||SY[x.k]||'').join('')}</div><div class=lgd>${[['B','壞球'],['S','好球'],['W','揮空'],['F','界外']].map(([k,t])=>`<span class=lgi>${PIC(k,14)}<span>${t}</span></span>`).join('')}</div></div></div>`}
async function vFetch(){
 V.vl=Date.now();
 try{let j=null,er=null;try{j=await sbFetch('/rest/v1/rpc/get_share',{method:'POST',body:JSON.stringify({share_id:VIEW})},false)}catch(e){er=e}
  if((!j||!j.data)&&on2()){try{j=await sb2Fetch('/rest/v1/rpc/get_share',{method:'POST',body:JSON.stringify({share_id:VIEW})},false)||j}catch(e){}}
  if(er&&!(j&&j.data))throw er;
  if(!j||!j.data){V.verr='找不到這場比賽，或分享已經停止。';S.games=[];V.gid=null;return R()}
  if(j.data.kind=='team'){const d=j.data;S.teams=d.teams||[];S.games=d.games||[];S.dr=d.dr?{[d.tid]:d.dr}:{};S.cfg=d.cfg||{};V.tid=d.tid;V.vk='team';V.gid=null;V.vt=new Date(j.updated_at).toLocaleTimeString();V.verr=null;return R()}V.vk=null;S.teams=j.data.teams||[];S.games=[j.data.game];V.gid=j.data.game.id;V.vt=new Date(j.updated_at).toLocaleTimeString();V.verr=null;R()
 }catch(e){if(!V.gid)V.verr='載入失敗：'+cloudErr(e.message);R()}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AU&&!VIEW)cloudSync()});

if(VIEW){V.sub='rec';vFetch();setInterval(()=>{if(!document.hidden&&Date.now()-(V.vl||0)>=(V.vk=='team'?600000:9000))vFetch()},5000)}else{S.games.forEach(healSides);R();cloudHash().then(()=>{if(AU)cloudSync().then(mirrorPush).then(shareSync)})}
</script></body></html>
