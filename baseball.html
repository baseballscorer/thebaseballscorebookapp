const GTIP=(()=>{const h=t=>`<div><b class=hl>${t}</b></div>`,d=t=>`<div>${t}</div>`,sp='<div>&nbsp;</div>',pdf='<div style="color:#888;font-size:11px">可點擊📄輸出為PDF檔</div>';return{
 lu:h('出賽名單')+d('輸入球員背號或名稱關鍵字')+d('確認先發球員及守備位子')+d('方法1：點擊欄位下方跳出之球員方塊')+d('方法2：按enter鍵確認')+d('（一般球隊：僅在篩選出唯一符合者時適用）')+d('（臨時球隊：可任意設定球員名稱後按確認）')+d('臨時球隊或尚未新增球員的球隊，按隊名行右側的'+tinI(IMPI)+'，可以一鍵產生先發陣容。')+d('已在球隊頁儲存預設先發的一般球隊，同位置的'+tinI(IMPI)+'則是匯入預設打線。')+sp+d('勾選下方不在先發名單中的選手，可以登錄為該場比賽之候補選手，未勾選則無法在比賽中上場。臨時球隊要設定候補選手，須在此先新增球員後再點選。')+d('臨時球隊在此介面按下新增球隊後，即可在球隊介面查看球隊資訊及數據。'),
 bx:h('賽況簡報')+d('簡記各局各打席結果。')+d('粗體字表示該打席有任意形式的得分進帳。')+sp+pdf,
 rec:h('比賽紀錄'),
 log:h('逐打席紀錄')+d('以文字逐球紀錄比賽發展。')+d('長按該打席空白區域，可以自行修改文字內容。')+sp+pdf,
 st:h('比賽數據')+d('紀錄兩隊選手在本場比賽的數據表現。')+d('點擊🔧按鈕可以自行修改選手的數據。')+sp+pdf}})();
const TIPSEC=[["投球操作區",["透過好壞球、界外球、保送、暴投、捕逸、犯規等按鍵直接進行紀錄。","有盜壘時，先按盜壘，再選盜壘結果和好壞球。"]],["跑壘操作區",["因盜壘及牽制致使壘上跑者出局或進壘時使用。","（牽制沒出局也沒有野手失誤的話不用操作）","趁傳進壘及妨礙跑壘，點擊進壘按鍵操作。","發生所有按鍵都不適用或不確定的出局情境時，也可以直接點擊出局鍵讓跑者出局，再自行修改文字記錄及數據"]],["擊球操作區",["1. 擊出球形成安打或出局、失誤時點擊對應按鍵。","2. 選擇擊球種類及野手之接傳球順序，可讓系統自動記錄比賽數據（不選擇則無法自動紀錄）。自踩壘包之紀錄方式為連續點擊兩次相同野手。","3. 安打球後若壘上跑者因野手發生失誤成功進壘，可以在安打的擊球紀錄介面點擊失誤按鍵，後續先操作沒有失誤時跑者攻佔的壘包，再紀錄失誤以及因為此失誤多前進的跑者。","4. 滾地球雙殺打可直接透過雙殺按鍵操作。接殺飛球後策動的雙殺守備則是透過飛球出局按鍵操作。"]],["更換選手區",["更換代打、代跑、代守或投手時操作。","點選欲退場選手和候補選手後確認即可更換上場。","也可以一次更換複數選手","1. 對位更換：按照順序點擊退場選手，再按照相同順序點選候補選手。","2. 移位+換人：如果要同時把場上的人換到另一個位子並且讓候補接替原位子時，可以先點擊移動的位子順序，再點擊要接替原位的選手。替補選手會從先點擊的位子接替，場上選手移動方法則是先點擊的選手接替後點擊的選手位子。"]],["特殊操作區",["比賽結束：未到正規局數就提前結束的比賽可以按下方的比賽結束按鍵。",tinI(UNI)+"：可以撤回上一個操作（包括數據更改）。",tinI(REI)+"：回到剛剛按"+tinI(UNI)+"之前的狀態。","▶️/⏸️：比賽計時器。",tinI(INFI)+"：重置計時器、輸出比賽數據做成PDF、分享比賽頁面連結，提供即時文字轉播。按右上角"+tinI(NAVI)+"可以回到比賽列表。","&nbsp;","🖱️長按計分板可以將計分板表格複製為圖片。"]],["突破僵局制",["正規局數結束後平手，系統會自動進入延長賽，視突破僵局制需求，可點選壘包圖樣設定該壘上跑者"]]];
const GAMESEC=[["如何新增比賽？",["按 "+tinI(PLI)+" 建立比賽設定","選擇比賽日期與時間 ⮕ 輸入比賽名稱以及預設正規局數","選擇比賽模式、主客隊","&nbsp;","<b class=hb>一般球隊</b>：已經在"+tinI(CFGI)+"建立的球隊，可以在右邊選單尋找。","<b class=hb>臨時球隊</b>：輸入的隊名若不是已建立的球隊，enter確認後，將暫時為僅存在於本場比賽的臨時球隊。","<b class=hb>練習模式</b>：選入比賽名單之選手無限制換上場次數","<b class=hb>正式模式</b>：上場之選手退場後不能再換上場","比賽方塊右邊的紅點代表比賽進行中，比賽結束紅點會消失"]],["如何刪除比賽？",["點選🗑️⮕點擊想刪除的比賽（可複選）再點擊刪除即可。","&nbsp;","如果沒有選擇任何比賽，再點一次刪除即可離開刪除操作，點擊比賽即可再次進入該比賽。"]],["如何修改資訊？",["點選"+tinI(PENI)+"，選擇欲修改之比賽設定。","點擊置頂可以把所選比賽放到列表最上方。"]],["如何篩選比賽？",["點擊"+tinI(SRCI)+"，選填篩選條件（不一定要全部填寫）","賽名及隊名會以關鍵字搜尋，不填入完整名稱亦可篩選","輸入完後按確認後即可篩選","清空後按確認或按取消=列出全部比賽"]],["如何建立比賽群組？",["長按比賽方塊，點選其他想納入群組的比賽，拖曳到右上角"+tinI(GRPI),"⮕輸入群組名稱","⮕確認要納入的比賽","⮕點擊確定建立","&nbsp;","<b class=hb>取消群組</b>：解散並刪除群組，群組內比賽回到根列表。","<b class=hb>移出群組</b>：點移出後再點擊想移出的比賽，再點移出，就可以讓所選比賽回到根列表。","&nbsp;","在群組列表時操作新增比賽，可以直接將比賽增加到群組內，點擊不加入則是會把比賽放在根列表！"]]];

function teamTeam(t){const T3=teamTeamData(t),DC=dirBlock('擊球分佈','a','dcf')+dirBlock('被擊球分佈','p','dcg');

const snapOf=g=>({game:g,teams:[...new Set([g.a,g.h])].map(id=>S.teams.find(t=>t.id==id)).filter(Boolean)});
const snapTeam=tid=>{const t=S.teams.find(x=>x.id==tid);if(!t)return null;const gs=S.games.filter(g=>g.a==tid||g.h==tid),ids=new Set([tid]);gs.forEach(g=>{ids.add(g.a);ids.add(g.h)});return{kind:'team',tid,teams:[...ids].map(id=>S.teams.find(x=>x.id==id)).filter(Boolean),games:gs,dr:(S.dr||{})[tid]||null,cfg:S.cfg||null}};
const snapKey=k=>{if(k.startsWith('team:'))return snapTeam(k.slice(5));const g=S.games.find(x=>x.id==k);return g?snapOf(g):null};
async function sharePush(gid){
 const data=snapKey(gid);if(!data)return null;const str=JSON.stringify(data);
 const j=await sbFetch('/rest/v1/shares?on_conflict=owner,game_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify({owner:uidOf(),game_id:gid,data,updated_at:new Date().toISOString()})});
 CL.sh[gid]=str;await mirrorShare(gid,j[0].id,data,str);return j[0].id}
async function shareSync(){
 if(!AU||VIEW||!S.sh||!navigator.onLine)return;
 for(const gid of Object.keys(S.sh)){const d=snapKey(gid);if(!d)continue;const str=JSON.stringify(d);if(str===CL.sh[gid]){if(on2()&&AU2&&MIR.sh[gid]!==str&&S.sh[gid])await mirrorShare(gid,S.sh[gid],d,str);continue}try{await sharePush(gid)}catch(e){CL.msg='分享更新失敗：'+cloudErr(e.message)}}}
async function shareCreate(gid){
 try{const id=await sharePush(gid);S.sh=S.sh||{};S.sh[gid]=id;V.smm=null;save()}catch(e){V.smm='建立失敗：'+cloudErr(e.message)}R()}
async function shareNow(gid){
 V.smm='上傳中…';R();
 try{delete CL.sh[gid];if(MIR.sh)delete MIR.sh[gid];await sharePush(gid);V.smm='已上傳 '+new Date().toLocaleTimeString('zh-TW',{hour12:false})+(MIR.msg?'　'+MIR.msg:'')}catch(e){V.smm='上傳失敗：'+cloudErr(e.message)}R()}
async function shareStop(gid){
 try{await sbFetch('/rest/v1/shares?owner=eq.'+uidOf()+'&game_id=eq.'+encodeURIComponent(gid),{method:'DELETE'});if(on2()&&AU2)try{await sb2Fetch('/rest/v1/shares?owner=eq.'+uidOf2()+'&game_id=eq.'+encodeURIComponent(gid),{method:'DELETE'})}catch(e){}delete S.sh[gid];delete CL.sh[gid];V.smm=null;save()}catch(e){V.smm='停止失敗：'+cloudErr(e.message)}R()}
function copyShare(){

 const gid=V.sm,TMN='知道連結的人可以查看這支球隊的打擊、投球、守備數據，並隨你的紀錄自動更新。',tm=gid.startsWith('team:'),noun=tm?'這支球隊的打擊、投球、守備數據':'這場比賽',id=(S.sh||{})[gid],link=id?location.origin+location.pathname+'?w='+id:'';
 return `<div class=mo onclick="V.sm=null;R()"><div class=md onclick="event.stopPropagation()"><b>🔗 分享${tm?'球隊數據':'比賽'}</b>`+(!AU?`<div class=row>點 ${cloudLink()} 登入帳號，建立分享連結。</div>`:id?`<div class=row style="font-size:12px;opacity:.8">${tm?TMN:`知道這個連結的人都能即時查看${noun}（唯讀），內容會隨你的紀錄自動更新：`}</div><div class=row><input id=shl value="${link}" readonly style="flex:1" onclick="this.select()"></div><div class=row>${btn('複製連結','copyShare()','pri')}${btn('立即更新',`shareNow('${gid}')`)}${btn('停止分享',`shareStop('${gid}')`)}</div>`:`<div class=row style="font-size:12px;opacity:.8">${tm?TMN:`建立連結後，知道連結的人可以唯讀查看${noun}，並隨你的紀錄自動更新。`}</div><div class=row>${btn('建立分享連結',`shareCreate('${gid}')`,'pri')}</div>`)+(V.smm?`<div class=row style="color:${/失敗/.test(V.smm)?'#d00':'inherit'};font-size:12px">${V.smm}</div>`:'')+`<div class=row style="justify-content:flex-end">${btn('關閉','V.sm=null;R()')}</div></div></div>`}

 try{gnuUpdate()}catch(e){}window.scrollTo(0,y)}

 if(g.lu.a.some(x=>!x.p)||g.lu.h.some(x=>!x.p))return board(g,o)+'<p>先發名單尚未設定完成。</p>';
 const bt=o.top?'a':'h',df=o.top?'h':'a',bi=o.bi[bt]%9;

 <div class=c><div style="text-align:center"><b>本打席逐球</b></div><div class=sy>${o.cur.filter(x=>x.p).map(x=>PIC(x.k)||SY[x.k]||'').join('')}</div><div class=lgd>${[['B','壞球'],['S','好球'],['W','揮空'],['F','界外']].map(([k,t])=>`<span class=lgi>${PIC(k,14)}<span>${t}</span></span>`).join('')}</div></div></div>`}

 V.vl=Date.now();
 try{let j=null,er=null;try{j=await sbFetch('/rest/v1/rpc/get_share',{method:'POST',body:JSON.stringify({share_id:VIEW})},false)}catch(e){er=e}
  if((!j||!j.data)&&on2()){try{j=await sb2Fetch('/rest/v1/rpc/get_share',{method:'POST',body:JSON.stringify({share_id:VIEW})},false)||j}catch(e){}}
